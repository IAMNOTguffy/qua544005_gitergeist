<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="João Miguel Melo"
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BGITERGEIST / Automatizador de Git</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    
    <!-- meu css -->
     <link rel="stylesheet" href="{{ url_for('static',filename='css/estilo.css') }}" type="text/css" media="all"> <!--media define em qual dispositvo vai roda-->
  </head>
  <body class="bg-dark" data-bs-theme="dark">

    <main class="container vh-100 d-flex align-items-center justify-content-center">
      <!-- Abre uma seção temática e aplica a classe "row" (do Bootstrap) para organizar o conteúdo em linha -->
      <section class="row">
        <!-- Cria um contêiner específico para mídia, centraliza o conteúdo (d-flex justify-content-center) e adiciona margem inferior (mb-3) -->
        <figure class="d-flex justify-content-center mb-3">
           <!-- Exibe a imagem buscando o caminho dinâmico na pasta "static/img/icon.png" via Flask/Jinja e define o texto alternativo "Logo" -->
          <img src="{{ url_for('static',filename='img/clown.png') }}" alt="Logo">
           <!-- Fecha o contêiner da imagem -->
        </figure>
        <div class="d-flex justify-content-center mb-5">
          <h1>Gitergest</h1>
        </div>
         <!--Secion é usado para agrupar conteúdos que tratam de um mesmo assunto-->
         <form action="" method="POST">
          <div class="col-12">
            <input type="text" class="form-control" placeholder="Informe o endereço do diretório do repositório local" name="repositorio" required>
          </div>
          <div class="d-flex justify-content-center mt-5">
            <button type="submit" class="btm btm-dark border border-dark-subtle col-4">Comitar e fazer push
            </button>
          </div>
         </form>
      </section> 
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
